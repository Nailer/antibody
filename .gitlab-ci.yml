stages:
  - verify
  - test
verify:
  image: node:24-bookworm
  stage: verify
  before_script:
    - apt-get update && apt-get install -y python3-venv
    - python3 -m venv .venv
    - .venv/bin/pip install semgrep==1.182.1
    - npm ci
  script:
    - npm test
    - npm run build
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
include:
  - local: .antibody/8a30e277-dac5-4e49-b57b-75c2d8b8913d-ci.yml
